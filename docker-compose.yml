version: "3.8"

networks:
  traefik:
    external: true
  app:
    internal: false

services:
  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - app
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  mcp-server:
    build:
      context: ./mcp-server
    expose:
      - "8001"
    env_file:
      - .env
    networks:
      - traefik
      - app
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-server.rule=Host(`${DOMAIN}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp-server.entrypoints=websecure"
      - "traefik.http.routers.mcp-server.tls=true"
      - "traefik.http.routers.mcp-server.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mcp-server.middlewares=mcp-stripprefix"
      - "traefik.http.middlewares.mcp-stripprefix.stripprefix.prefixes=/mcp"
      - "traefik.http.services.mcp-server.loadbalancer.server.port=8001"
      - "traefik.docker.network=traefik"

  frontend:
    build:
      context: ./frontend
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - traefik
      - app
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"
