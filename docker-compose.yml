version: "3.8"

networks:
  cloud:
    external: true
  app:
    internal: false

services:
  backend:
    container_name: health-tracker-backend
    build:
      context: ./backend
    expose:
      - "8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    networks:
      - cloud
      - app
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  mcp-server:
    container_name: health-tracker-mcp-server
    build:
      context: ./mcp-server
    expose:
      - "8001"
    environment:
      - DJANGO_API_URL=${DJANGO_API_URL}
      - MCP_API_KEY=${MCP_API_KEY}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    networks:
      - cloud
      - app
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-server.rule=Host(`health.s8e.in`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp-server.entrypoints=websecure"
      - "traefik.http.routers.mcp-server.tls=true"
      - "traefik.http.routers.mcp-server.tls.certresolver=cloudflare"
      - "traefik.http.routers.mcp-server.middlewares=mcp-stripprefix"
      - "traefik.http.middlewares.mcp-stripprefix.stripprefix.prefixes=/mcp"
      - "traefik.http.services.mcp-server.loadbalancer.server.port=8001"
      - "traefik.docker.network=cloud"

  frontend:
    container_name: health-tracker-frontend
    build:
      context: ./frontend
    expose:
      - "3000"
    networks:
      - cloud
      - app
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`health.s8e.in`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=cloudflare"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=cloud"
