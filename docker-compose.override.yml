# Local development override — no Traefik, direct port mapping + local PostgreSQL
# docker-compose automatically merges this with docker-compose.yml

networks:
  traefik:
    external: false   # create locally, not external
  app:
    internal: false   # allow internet access for local dev (Open Food Facts API, etc.)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: health_tracker
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  mcp-server:
    ports:
      - "8001:8001"
    labels:
      - "traefik.enable=false"

  frontend:
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=false"
      - "traefik.http.routers.frontend.middlewares="

volumes:
  pgdata:
